execution:
  - executor: k6
    concurrency: 5
    hold-for: 30s
    scenario: my_k6_scn

scenarios:
  my_k6_scn:
    script: example.js


passfail:
  - avg-rt>10ms, stop as failed, label: "Avg response time > 10 ms"
  - failures>10%, stop as failed, label: "Failures > 10%"


reporting:
  - module: final-stats

  
