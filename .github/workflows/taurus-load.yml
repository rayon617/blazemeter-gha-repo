execution:
  - executor: k6
    concurrency: 5
    hold-for: 30s
    scenario: my_k6_scn

scenarios:
  my_k6_scn:
    script: example.js

reporting:
  - module: passfail
    criteria:
      - avg-rt>10ms, stop as failed, label: Avg response time > 10 ms
      - failures>0%, stop as failed, label: Any failure stops the test

  - module: final-stats
  
