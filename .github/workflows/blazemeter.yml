name: failure criteria code

on:
  workflow_dispatch:

jobs:
  reproduce-400-error:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

    

      - name: failure criteria code
        uses: Blazemeter/github-action@v8.5
        with:
          apiKey: ${{ secrets.BLAZEMETER_API_KEY }}
          apiSecret: ${{ secrets.BLAZEMETER_API_SECRET }}
          projectID: ${{ secrets.BLAZEMETER_PROJECT_ID }}
          #createTest: "true"
          testID: "15428359"
          

          testName: "Failure criteria code test"
          continuePipeline: "false"
          showTailLog: "true"
          
          locations: ""
